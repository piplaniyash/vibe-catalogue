<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care Navigator App</title>
<meta name="description" content="A working prototype of a cancer care navigator console: patient summaries, longitudinal timelines, check-ins, medicines, costs and tasks. Fictional data.">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style>
  .demo-bar { background: var(--brand-tint); color: #4B0679; font-size: 13px; }
  .demo-inner { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px 16px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .demo-inner .acts { display: flex; gap: 4px; }
  .link-btn { font: inherit; font-size: 13px; font-weight: 700; background: none; border: 0; color: var(--brand); cursor: pointer; padding: 4px 8px; border-radius: 8px; }
  .link-btn:hover { background: rgba(130,10,209,.08); }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 16px 72px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .side-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 18px 12px 6px; }
  .side-item { font: inherit; text-align: left; background: none; border: 0; border-radius: 14px; padding: 10px 12px; cursor: pointer; color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .side-item:hover { background: var(--surface); }
  .side-item.on { background: var(--brand-tint); }
  .side-item b { display: block; font-size: 15px; }
  .side-item small { display: block; color: var(--muted); font-size: 12px; }
  .badge { min-width: 22px; height: 22px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; flex: none; }
  .side-item.on .badge { background: var(--bg); }
  .badge.urgent, .side-item.on .badge.urgent { background: #D92D20; color: #fff; }
  .side .btn { margin-top: 12px; justify-content: center; }

  .eyebrow { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .08em; }
  .ph { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .ph h1 { font-size: clamp(28px, 4vw, 38px); letter-spacing: -0.03em; margin: 6px 0 0; line-height: 1.1; }
  .ph .sub { color: var(--muted); margin: 6px 0 0; }
  .ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm { padding: 10px 16px; font-size: 14px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0; overflow-x: auto; }
  .tab { font: inherit; font-size: 15px; font-weight: 600; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-bottom-color: var(--brand); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border-radius: 18px; padding: 16px 18px; }
  .tile span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tile b { display: block; font-size: 17px; margin-top: 6px; letter-spacing: -0.01em; line-height: 1.3; }
  .tile small { color: var(--muted); font-size: 13px; }
  .tile.big b { font-size: 28px; }

  .box { border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; margin-top: 16px; }
  .box h3 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

  .alerts { display: grid; gap: 8px; }
  .alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--surface); cursor: pointer; font: inherit; text-align: left; border: 0; width: 100%; color: inherit; }
  .alert:hover { box-shadow: inset 0 0 0 1.5px var(--brand-tint); }
  .alert .lv { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: #B8B2C0; }
  .alert.l2 .lv { background: var(--brand); }
  .alert.l3 { background: #FDECEC; }
  .alert.l3 .lv { background: #D92D20; }
  .alert b { display: block; font-size: 15px; }
  .alert small { color: var(--muted); font-size: 13px; }
  .alert .who { display: block; font-size: 12px; font-weight: 700; color: var(--brand); }

  .summary-text { font-size: 15px; line-height: 1.7; margin: 0; }
  dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 24px; margin: 0; }
  dl.facts dt { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  dl.facts dd { margin: 2px 0 0; font-size: 15px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .chip.on { background: var(--brand-tint); border-color: var(--brand-tint); color: var(--brand); }

  .tl-month { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 24px 0 4px; }
  .ev { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ev .d { font-size: 13px; font-weight: 700; color: var(--muted); padding-top: 2px; }
  .ev .type { font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .06em; }
  .ev.is-alert .type { color: #D92D20; }
  .ev b { display: block; font-size: 15px; }
  .ev p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }

  .row { display: flex; justify-content: space-between; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start; flex-wrap: wrap; }
  .row:last-child { border-bottom: 0; }
  .row .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .pill-s { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--surface); color: var(--muted); white-space: nowrap; }
  .pill-s.red { background: #FDECEC; color: #B42318; }
  .pill-s.ok { background: var(--brand-tint); color: var(--brand); }

  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  .strip { display: flex; gap: 4px; margin-top: 12px; }
  .strip span { flex: 1; height: 22px; border-radius: 6px; background: var(--line); }
  .strip span.t { background: var(--brand); }
  .strip span.m { background: #F4B8B2; }
  .strip span.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--brand); }
  .strip-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar div { height: 100%; background: var(--brand); border-radius: 8px; }

  .task { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input { accent-color: var(--brand); width: 18px; height: 18px; margin-top: 2px; flex: none; cursor: pointer; }
  .task .tx { flex: 1; }
  .task.done .tx b { text-decoration: line-through; color: var(--muted); }
  .task .tx b { display: block; font-size: 15px; font-weight: 600; }
  select.inline { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: var(--bg); color: var(--ink); cursor: pointer; }

  dialog { border: 0; border-radius: 24px; padding: 0; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 64px rgba(30,0,60,.25); color: var(--ink); }
  dialog::backdrop { background: rgba(20,10,30,.45); }
  .form { padding: 26px; }
  .form h2 { margin: 0 0 18px; font-size: 22px; letter-spacing: -0.02em; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field em { font-style: normal; color: var(--brand); }
  .field input:not([type=range]), .field select, .field textarea { font: inherit; font-size: 15px; width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); }
  .field input[type=range] { width: 100%; accent-color: var(--brand); }
  .form-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

  .thread { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding: 4px 2px; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; }
  .bubble.me { align-self: flex-end; background: var(--brand-tint); border-top-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--surface); border-top-left-radius: 4px; }
  .bubble small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .reply { display: flex; gap: 8px; margin-top: 14px; align-items: flex-end; }
  .reply textarea { flex: 1; font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line); resize: vertical; min-height: 46px; }
  .reply textarea:focus { outline: none; border-color: var(--brand); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--muted); margin: 4px 0; font-size: 15px; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 16px; }
    .side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
    .side-label { display: none; }
    .side-item { flex: none; background: var(--surface); }
    .side-item small { display: none; }
    .side .btn { margin-top: 0; flex: none; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="index.html"><span class="mark">B</span>The Build Log</a>
  <div class="nav-links">
    <a href="care-family.html">Family app</a>
    <a href="care-journey.html">The story</a>
    <a href="index.html#builds">Builds</a>
  </div>
</nav>

<div class="demo-bar">
  <div class="demo-inner">
    <span><b>Demo app.</b> Fictional patients, not medical advice. What you add is saved only in this browser, so please don't enter real patient details.</span>
    <span class="acts">
      <button class="link-btn" data-act="export">Export data</button>
      <button class="link-btn" data-act="reset">Reset demo</button>
    </span>
  </div>
</div>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script src="care-data.js?v=1"></script>
<script>
  let view = { kind: "today" };
  let tlFilter = "All";

  // ---------- Rendering ----------
  function render() { renderSide(); view.kind === "today" ? renderToday() : renderPatient(); save(); }

  function alertBtn(a, p, showWho) {
    return `<button class="alert l${a.lvl}" data-act="open" data-id="${p.id}" data-tab="${a.tab}"><span class="lv"></span>
      <span>${showWho ? `<span class="who">${esc(p.name)}</span>` : ""}<b>${esc(a.text)}</b><small>${esc(a.detail)}</small></span></button>`;
  }

  function renderSide() {
    const total = db.patients.reduce((n, p) => n + alerts(p).length, 0);
    $("side").innerHTML = `
      <button class="side-item ${view.kind === "today" ? "on" : ""}" data-act="today"><span><b>Today</b><small>Alerts and appointments</small></span><span class="badge">${total}</span></button>
      <div class="side-label">Patients (${db.patients.length})</div>
      ${db.patients.map(p => {
        const al = alerts(p), urgent = al.some(a => a.lvl === 3);
        const phase = p.phase.length > 26 ? p.phase.slice(0, 25) + "…" : p.phase;
        return `<button class="side-item ${view.kind === "patient" && view.id === p.id ? "on" : ""}" data-act="open" data-id="${p.id}">
          <span><b>${esc(p.name)}</b><small>${esc(p.city)} · ${esc(phase)}</small></span>
          ${al.length ? `<span class="badge ${urgent ? "urgent" : ""}">${al.length}</span>` : ""}</button>`;
      }).join("")}
      <button class="btn btn-soft btn-sm" data-act="new">+ New patient</button>`;
  }

  function renderToday() {
    const all = db.patients.flatMap(p => alerts(p).map(a => ({ a, p }))).sort((x, y) => y.a.lvl - x.a.lvl);
    const appts = db.patients.filter(p => p.nextAppt && p.nextAppt.date && diff(p.nextAppt.date) >= 0 && diff(p.nextAppt.date) <= 14)
      .sort((a, b) => a.nextAppt.date < b.nextAppt.date ? -1 : 1);
    const openTasks = db.patients.flatMap(p => p.tasks.filter(t => !t.done && t.due && diff(t.due) <= 0).map(t => ({ t, p })));
    const urgent = all.filter(x => x.a.lvl === 3).length, follow = all.filter(x => x.a.lvl === 2).length;
    $("main").innerHTML = `
      <div class="ph"><div><div class="eyebrow">Navigator console</div><h1>${fmtLong(TODAY)}</h1>
        <p class="sub">${plural(db.patients.length, "patient")} · ${plural(all.length, "alert")} · ${plural(openTasks.length, "task")} due today or overdue</p></div></div>
      <div class="tiles" style="margin-top:24px">
        <div class="tile big"><span>Urgent</span><b style="${urgent ? "color:#D92D20" : ""}">${urgent}</b></div>
        <div class="tile big"><span>Follow up</span><b>${follow}</b></div>
        <div class="tile big"><span>Appointments, 14 days</span><b>${appts.length}</b></div>
        <div class="tile big"><span>Tasks due</span><b>${openTasks.length}</b></div>
      </div>
      <div class="box"><h3>Alerts</h3><div class="alerts">${all.map(x => alertBtn(x.a, x.p, true)).join("") || `<p class="empty">All clear. Nothing needs attention.</p>`}</div></div>
      <div class="box"><h3>Tasks due today or overdue</h3>
        ${openTasks.map(({ t, p }) => `<div class="row"><span><b>${esc(t.text)}</b><br><small class="muted">${esc(p.name)} · ${esc(t.owner)}</small></span>
          <span class="pill-s ${diff(t.due) < 0 ? "red" : ""}">${diff(t.due) < 0 ? "Overdue, " + fmt(t.due) : "Today"}</span></div>`).join("") || `<p class="empty">Nothing due.</p>`}</div>
      <div class="box"><h3>Upcoming appointments</h3>
        ${appts.map(p => `<div class="row"><span><b>${esc(p.nextAppt.what)}</b><br><small class="muted">${esc(p.name)} · ${esc(p.hospital)}</small></span>
          <span class="pill-s ok">${fmt(p.nextAppt.date)} · ${rel(p.nextAppt.date)}</span></div>`).join("") || `<p class="empty">No appointments in the next two weeks.</p>`}</div>`;
  }

  const TABS = [["summary", "Summary"], ["timeline", "Timeline"], ["checkins", "Check-ins"], ["meds", "Medicines"], ["costs", "Costs & schemes"], ["tasks", "Tasks"], ["messages", "Messages"]];

  function renderPatient() {
    const p = P(view.id);
    if (!p) { view = { kind: "today" }; return render(); }
    $("main").innerHTML = `
      <div class="ph">
        <div><div class="eyebrow">Patient</div><h1>${esc(p.name)}</h1>
          <p class="sub">${esc(p.age)} · ${esc(p.city)} · ${esc(p.diagnosis)}</p></div>
        <div class="acts">
          <button class="btn btn-soft btn-sm" data-act="edit">Edit profile</button>
          <button class="btn btn-brand btn-sm" data-act="checkin">+ Log check-in</button>
        </div>
      </div>
      <div class="tabs">${TABS.map(([k, label]) => `<button class="tab ${view.tab === k ? "on" : ""}" data-act="tab" data-tab="${k}">${label}</button>`).join("")}</div>
      <div id="tab">${({ summary: tabSummary, timeline: tabTimeline, checkins: tabCheckins, meds: tabMeds, costs: tabCosts, tasks: tabTasks, messages: tabMessages })[view.tab](p)}</div>`;
  }

  function tabSummary(p) {
    const l = latest(p), a = adherence(p), al = alerts(p);
    const recent = [...p.events].sort((x, y) => x.date < y.date ? 1 : -1).slice(0, 4);
    return `
      ${al.length ? `<div class="alerts" style="margin-bottom:16px">${al.map(x => alertBtn(x, p, false)).join("")}</div>` : ""}
      <div class="tiles">
        <div class="tile"><span>Treatment</span><b>${esc(p.phase)}</b></div>
        <div class="tile"><span>Next appointment</span><b>${p.nextAppt && p.nextAppt.date ? esc(p.nextAppt.what) : "None booked"}</b>${p.nextAppt && p.nextAppt.date ? `<small>${fmt(p.nextAppt.date)} · ${rel(p.nextAppt.date)}</small>` : ""}</div>
        <div class="tile"><span>Last check-in</span><b>${l ? `Pain ${l.pain}/10 · Fatigue ${l.fatigue}/10` : "None yet"}</b>${l ? `<small>${rel(l.date)}${l.fever ? " · fever" : ""}</small>` : ""}</div>
        <div class="tile"><span>Medicines, 14 days</span><b>${a === null ? "No medicines" : a + "% taken"}</b></div>
      </div>
      <div class="box"><h3>Navigator summary <button class="link-btn" data-act="copy">Copy for WhatsApp</button></h3>
        <p class="summary-text">${esc(summaryText(p))}</p></div>
      <div class="box"><h3>Profile</h3>
        <dl class="facts">
          <div><dt>Diagnosis</dt><dd>${esc(p.diagnosis)}</dd></div>
          <div><dt>Hospital</dt><dd>${esc(p.hospital)}</dd></div>
          <div><dt>Oncologist</dt><dd>${esc(p.oncologist)}</dd></div>
          <div><dt>Primary caregiver</dt><dd>${esc(p.caregiver)}${p.relation ? `<br><small class="muted">${esc(p.relation)}</small>` : ""}</dd></div>
          <div><dt>Language</dt><dd>${esc(p.language)}</dd></div>
          <div><dt>Insurance</dt><dd>${esc(p.insurance)}</dd></div>
        </dl></div>
      <div class="box"><h3>Recent history <button class="link-btn" data-act="tab" data-tab="timeline">Full timeline →</button></h3>
        ${recent.map(evHtml).join("") || `<p class="empty">No events yet.</p>`}</div>`;
  }

  function evHtml(e) {
    return `<div class="ev ${e.type === "Alert" ? "is-alert" : ""}"><div class="d">${fmt(e.date)}</div>
      <div><span class="type">${esc(e.type)}</span><b>${esc(e.title)}</b>${e.note ? `<p>${esc(e.note)}</p>` : ""}</div></div>`;
  }

  function tabTimeline(p) {
    const used = TYPES.filter(t => p.events.some(e => e.type === t));
    const list = [...p.events].filter(e => tlFilter === "All" || e.type === tlFilter).sort((a, b) => a.date < b.date ? 1 : -1);
    let month = "", html = "";
    list.forEach(e => {
      const m = toDate(e.date).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
      if (m !== month) { month = m; html += `<div class="tl-month">${m}</div>`; }
      html += evHtml(e);
    });
    const first = [...p.events].sort((a, b) => a.date < b.date ? -1 : 1)[0];
    return `
      <div class="ph" style="align-items:center"><p class="muted" style="margin:0">${plural(p.events.length, "event")}${first ? ` since ${fmt(first.date)}` : ""}. Newest first.</p>
        <button class="btn btn-brand btn-sm" data-act="add-event">+ Add event</button></div>
      <div class="chips" style="margin-top:16px">${["All", ...used].map(t => `<button class="chip ${t === tlFilter ? "on" : ""}" data-act="filter" data-t="${t}">${t}</button>`).join("")}</div>
      ${html || `<p class="empty">No events of this type yet.</p>`}`;
  }

  function chart(cs) {
    const pts = cs.slice(-14);
    if (pts.length < 2) return `<p class="empty">Log at least two check-ins to see a trend.</p>`;
    const W = 640, H = 190, pl = 30, pr = 12, pt = 12, pb = 26;
    const x = i => pl + i * (W - pl - pr) / (pts.length - 1), y = v => pt + (10 - v) * (H - pt - pb) / 10;
    const line = (k, c, dash) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" ${dash ? 'stroke-dasharray="5 5"' : ""} stroke-linejoin="round" points="${pts.map((p, i) => `${x(i)},${y(p[k])}`).join(" ")}"/>`;
    const grid = [0, 5, 10].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#ECE8F0"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5F5B66">${v}</text>`).join("");
    const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.pain)}" r="${p.fever ? 6 : 3.5}" fill="${p.fever ? "#D92D20" : "#820AD1"}" stroke="#fff" stroke-width="1.5"><title>${fmt(p.date)}: pain ${p.pain}, fatigue ${p.fatigue}${p.fever ? ", fever" : ""}</title></circle>`).join("");
    const labels = `<text x="${pl}" y="${H - 6}" font-size="11" fill="#5F5B66">${fmt(pts[0].date)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" fill="#5F5B66">${fmt(pts[pts.length - 1].date)}</text>`;
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pain and fatigue trend">${grid}${line("fatigue", "#B8B2C0", true)}${line("pain", "#820AD1")}${dots}${labels}</svg>
      <div class="legend"><span><i style="background:#820AD1"></i>Pain (0 to 10)</span><span><i style="background:#B8B2C0"></i>Fatigue (0 to 10)</span><span><i style="background:#D92D20;width:8px;height:8px;border-radius:50%"></i>Fever</span></div></div>`;
  }

  function tabCheckins(p) {
    const cs = sortedCheckins(p);
    return `
      <div class="box" style="margin-top:0"><h3>Last two weeks <button class="btn btn-brand btn-sm" data-act="checkin">+ Log check-in</button></h3>${chart(cs)}</div>
      <div class="box"><h3>All check-ins</h3>
        ${[...cs].reverse().map(c => `<div class="row"><span><b>${fmt(c.date)}</b> <small class="muted">${rel(c.date)}</small>${c.note ? `<br><small class="muted">${esc(c.note)}</small>` : ""}</span>
          <span class="pills">${c.fever ? `<span class="pill-s red">Fever</span>` : ""}
            <span class="pill-s ${c.pain >= 7 ? "red" : ""}">Pain ${c.pain}/10</span><span class="pill-s">Fatigue ${c.fatigue}/10</span>
            <span class="pill-s">Appetite ${esc(String(c.appetite).toLowerCase())}</span>
            <span class="pill-s ${c.doses ? "ok" : "red"}">${c.doses ? "Medicines taken" : "Missed medicines"}</span></span></div>`).join("") || `<p class="empty">No check-ins yet.</p>`}</div>`;
  }

  function tabMeds(p) {
    return `
      <div class="ph" style="align-items:center"><p class="muted" style="margin:0">Mark doses as the family confirms them on WhatsApp.</p>
        <button class="btn btn-brand btn-sm" data-act="add-med">+ Add medicine</button></div>
      ${p.meds.map(m => {
        const done = !!m.taken[TODAY], d = daysLeft(m), miss = missedDays(m, 14);
        let counted = 0, ok = 0;
        const strip = Array.from({ length: 14 }, (_, k) => {
          const i = 13 - k, day = off(-i);
          if (i > 0 && day >= m.since) { counted++; if (m.taken[day]) ok++; }
          const cls = m.taken[day] ? "t" : (i > 0 && day >= m.since ? "m" : "");
          return `<span class="${cls} ${i === 0 ? "today" : ""}" title="${fmt(day)}: ${m.taken[day] ? "taken" : i === 0 ? "not yet" : "missed"}"></span>`;
        }).join("");
        return `<div class="box"><h3><span>${esc(m.name)} <small class="muted" style="font-weight:600">· ${esc(m.dose)}</small></span>
            <button class="btn ${done ? "btn-soft" : "btn-brand"} btn-sm" data-act="take" data-mid="${m.id}">${done ? "Taken today ✓" : "Mark today's doses taken"}</button></h3>
          <p class="muted" style="margin:0">${esc(m.schedule)}</p>
          <div class="strip">${strip}</div>
          <div class="strip-labels"><span>14 days ago</span><span>Today</span></div>
          <div class="row" style="margin-top:8px"><span>${counted ? Math.round(ok * 100 / counted) + "% of days taken" : "Just started"}${miss ? ` · <span style="color:#B42318">${plural(miss, "missed day")}</span>` : ""}</span>
            <span class="pills"><span class="pill-s ${d <= 7 ? "red" : ""}">${m.left} tablets · about ${plural(d, "day")}</span>
            <button class="link-btn" data-act="refill" data-mid="${m.id}">Record refill</button></span></div></div>`;
      }).join("") || `<p class="empty" style="margin-top:16px">No medicines added yet.</p>`}`;
  }

  function tabCosts(p) {
    const total = p.costs.reduce((n, c) => n + Number(c.amount || 0), 0);
    const by = PAYERS.map(k => [k, p.costs.filter(c => c.payer === k).reduce((n, c) => n + Number(c.amount || 0), 0)]).filter(x => x[1]);
    return `
      <div class="tiles">
        <div class="tile big"><span>Total so far</span><b>${rupees(total)}</b></div>
        ${by.map(([k, v]) => `<div class="tile"><span>Paid by ${k.toLowerCase()}</span><b>${rupees(v)}</b><div class="bar"><div style="width:${total ? v * 100 / total : 0}%"></div></div></div>`).join("")}
      </div>
      <div class="box"><h3>Schemes and support <button class="link-btn" data-act="add-scheme">+ Add</button></h3>
        ${p.schemes.map((s, i) => `<div class="row" style="align-items:center"><b style="font-weight:600">${esc(s.name)}</b>
          <select class="inline" data-act="scheme" data-i="${i}">${SCHEME_STATUS.map(o => `<option ${o === s.status ? "selected" : ""}>${o}</option>`).join("")}</select></div>`).join("") || `<p class="empty">None added yet.</p>`}</div>
      <div class="box"><h3>Ledger <button class="btn btn-brand btn-sm" data-act="add-cost">+ Add cost</button></h3>
        ${[...p.costs].sort((a, b) => a.date < b.date ? 1 : -1).map(c => `<div class="row"><span><b style="font-weight:600">${esc(c.item)}</b><br><small class="muted">${fmt(c.date)} · ${esc(c.payer)}</small></span><b>${rupees(c.amount)}</b></div>`).join("") || `<p class="empty">No costs logged yet.</p>`}</div>`;
  }

  function tabTasks(p) {
    const list = [...p.tasks].sort((a, b) => (a.done - b.done) || ((a.due || "9") < (b.due || "9") ? -1 : 1));
    return `
      <div class="box" style="margin-top:0"><h3>${plural(p.tasks.filter(t => !t.done).length, "open task")} <button class="btn btn-brand btn-sm" data-act="add-task">+ Add task</button></h3>
        ${list.map(t => `<label class="task ${t.done ? "done" : ""}"><input type="checkbox" data-act="task" data-tid="${t.id}" ${t.done ? "checked" : ""}>
          <span class="tx"><b>${esc(t.text)}</b><small class="muted">${esc(t.owner)}</small></span>
          ${t.due ? `<span class="pill-s ${!t.done && diff(t.due) < 0 ? "red" : ""}">${!t.done && diff(t.due) < 0 ? "Overdue · " : ""}${fmt(t.due)}</span>` : ""}</label>`).join("") || `<p class="empty">No tasks yet.</p>`}</div>`;
  }

  function tabMessages(p) {
    return `<div class="box" style="margin-top:0"><h3>WhatsApp with ${esc(p.caregiver || "the family")}</h3>
      <div class="thread" id="thread">${p.messages.map(m => `<div class="bubble ${m.from === "nav" ? "me" : "them"}">${esc(m.text)}
        <small>${m.from === "nav" ? "Asha" : esc(p.caregiver || "Family")} · ${msgTime(m.at)}</small></div>`).join("") || `<p class="empty">No messages yet.</p>`}</div>
      <form class="reply" data-form="send"><textarea name="text" rows="2" placeholder="Reply as Asha" required></textarea><button class="btn btn-brand btn-sm" type="submit">Send</button></form></div>`;
  }

  // ---------- Forms ----------
  function fieldHtml(f) {
    if (f.row) return `<div class="grid2">${f.row.map(fieldHtml).join("")}</div>`;
    const v = f.value ?? "";
    let input;
    if (f.type === "select") input = `<select name="${f.k}">${f.options.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.type === "textarea") input = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
    else if (f.type === "range") input = `<input type="range" name="${f.k}" min="0" max="10" value="${v || 0}">`;
    else input = `<input type="${f.type || "text"}" name="${f.k}" value="${esc(v)}" ${f.req ? "required" : ""} ${f.type === "number" ? 'min="0"' : ""}>`;
    return `<label class="field"><span>${esc(f.label)}${f.type === "range" ? `: <em>${v || 0}</em>/10` : ""}</span>${input}</label>`;
  }

  function openForm(title, fields, onSave, submit = "Save") {
    const d = $("dlg"), flat = fields.flatMap(f => f.row || [f]);
    d.innerHTML = `<form class="form"><h2>${esc(title)}</h2>${fields.map(fieldHtml).join("")}
      <div class="form-acts"><button type="button" class="btn btn-soft btn-sm" data-close>Cancel</button><button class="btn btn-brand btn-sm" type="submit">${submit}</button></div></form>`;
    d.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => { r.closest(".field").querySelector("em").textContent = r.value; });
    d.querySelector("[data-close]").onclick = () => d.close();
    d.querySelector("form").onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target), v = {};
      flat.forEach(f => { let x = fd.get(f.k); if (f.type === "number" || f.type === "range") x = Number(x || 0); v[f.k] = typeof x === "string" ? x.trim() : x; });
      d.close(); onSave(v); render();
    };
    d.showModal();
  }

  function profileFields(p = {}) {
    return [
      { k: "name", label: "Patient name", req: true, value: p.name },
      { row: [{ k: "age", label: "Age", type: "number", value: p.age }, { k: "city", label: "City", value: p.city }] },
      { k: "diagnosis", label: "Diagnosis", value: p.diagnosis },
      { row: [{ k: "hospital", label: "Hospital", value: p.hospital }, { k: "oncologist", label: "Oncologist", value: p.oncologist }] },
      { row: [{ k: "caregiver", label: "Primary caregiver", value: p.caregiver }, { k: "relation", label: "Relation", value: p.relation }] },
      { row: [{ k: "language", label: "Language", value: p.language }, { k: "insurance", label: "Insurance", value: p.insurance }] },
      { k: "phase", label: "Current treatment phase", value: p.phase },
      { row: [{ k: "apptDate", label: "Next appointment", type: "date", value: p.nextAppt && p.nextAppt.date }, { k: "apptWhat", label: "What is it?", value: p.nextAppt && p.nextAppt.what }] }
    ];
  }
  function applyProfile(p, v) {
    ["name", "age", "city", "diagnosis", "hospital", "oncologist", "caregiver", "relation", "language", "insurance", "phase"].forEach(k => p[k] = v[k]);
    p.nextAppt = v.apptDate ? { date: v.apptDate, what: v.apptWhat || "Appointment" } : null;
  }

  // ---------- Actions ----------
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2800); }

  const actions = {
    today() { view = { kind: "today" }; render(); scrollTo({ top: 0, behavior: "smooth" }); },
    open(el) { view = { kind: "patient", id: el.dataset.id, tab: el.dataset.tab || "summary" }; tlFilter = "All"; render(); scrollTo({ top: 0, behavior: "smooth" }); },
    tab(el) { view.tab = el.dataset.tab; render(); },
    filter(el) { tlFilter = el.dataset.t; render(); },
    new() {
      openForm("New patient", profileFields(), v => {
        const p = { id: uid(), events: [], checkins: [], meds: [], costs: [], schemes: [], tasks: [] };
        applyProfile(p, v);
        p.events.push({ id: uid(), date: TODAY, type: "Note", title: "Added to navigation", note: "" });
        db.patients.push(p); view = { kind: "patient", id: p.id, tab: "summary" }; toast(`${p.name} added`);
      }, "Add patient");
    },
    edit() { const p = P(view.id); openForm("Edit profile", profileFields(p), v => { applyProfile(p, v); toast("Profile updated"); }); },
    checkin() {
      const p = P(view.id);
      openForm(`Check-in for ${p.name}`, [
        { row: [{ k: "date", label: "Date", type: "date", value: TODAY }, { k: "fever", label: "Fever?", type: "select", options: ["No", "Yes"], value: "No" }] },
        { k: "pain", label: "Pain", type: "range", value: 2 },
        { k: "fatigue", label: "Fatigue", type: "range", value: 3 },
        { row: [{ k: "appetite", label: "Appetite", type: "select", options: ["Good", "Okay", "Poor"], value: "Good" }, { k: "doses", label: "Medicines taken?", type: "select", options: ["Yes", "No"], value: "Yes" }] },
        { k: "note", label: "Note from the family", type: "textarea" }
      ], v => {
        const c = { date: v.date || TODAY, fever: v.fever === "Yes", pain: v.pain, fatigue: v.fatigue, appetite: v.appetite, doses: v.doses === "Yes", note: v.note };
        p.checkins = p.checkins.filter(x => x.date !== c.date).concat(c);
        if (c.fever || c.pain >= 7) {
          p.events.push({ id: uid(), date: c.date, type: "Alert", title: c.fever ? "Fever reported in check-in" : `High pain (${c.pain}/10) reported`, note: c.note });
          toast(c.fever ? "Fever logged. Urgent alert raised." : "High pain logged. Flagged for follow-up.");
        } else toast("Check-in saved");
        view.tab = "checkins";
      });
    },
    "add-event"() {
      const p = P(view.id);
      openForm("Add to timeline", [
        { row: [{ k: "date", label: "Date", type: "date", value: TODAY }, { k: "type", label: "Type", type: "select", options: TYPES, value: "Consult" }] },
        { k: "title", label: "What happened?", req: true },
        { k: "note", label: "Notes", type: "textarea" }
      ], v => { p.events.push({ id: uid(), date: v.date || TODAY, type: v.type, title: v.title, note: v.note }); toast("Added to timeline"); });
    },
    "add-med"() {
      const p = P(view.id);
      openForm("Add medicine", [
        { k: "name", label: "Medicine", req: true },
        { row: [{ k: "dose", label: "Dose", value: "1 tablet" }, { k: "perDay", label: "Tablets per day", type: "number", value: 1 }] },
        { k: "schedule", label: "Schedule", value: "Once a day" },
        { k: "left", label: "Tablets at home", type: "number", value: 30 }
      ], v => { p.meds.push({ id: uid(), name: v.name, dose: v.dose, schedule: v.schedule, perDay: Math.max(1, v.perDay), left: v.left, since: TODAY, taken: {} }); toast("Medicine added"); });
    },
    take(el) {
      const m = P(view.id).meds.find(x => x.id === el.dataset.mid);
      if (m.taken[TODAY]) { delete m.taken[TODAY]; m.left += m.perDay; toast("Unmarked"); }
      else { m.taken[TODAY] = true; m.left = Math.max(0, m.left - m.perDay); toast("Today's doses marked as taken"); }
      render();
    },
    refill(el) {
      const m = P(view.id).meds.find(x => x.id === el.dataset.mid);
      openForm(`Refill: ${m.name}`, [{ k: "qty", label: "Tablets received", type: "number", value: m.perDay * 30 }], v => { m.left += v.qty; toast(`Refill recorded. ${m.left} tablets now.`); });
    },
    "add-cost"() {
      const p = P(view.id);
      openForm("Add cost", [
        { row: [{ k: "date", label: "Date", type: "date", value: TODAY }, { k: "amount", label: "Amount (₹)", type: "number", req: true }] },
        { k: "item", label: "What for?", req: true },
        { k: "payer", label: "Paid by", type: "select", options: PAYERS, value: "Family" }
      ], v => { p.costs.push({ id: uid(), date: v.date || TODAY, item: v.item, amount: v.amount, payer: v.payer }); toast("Cost added"); });
    },
    "add-scheme"() {
      const p = P(view.id);
      openForm("Add scheme or support", [
        { k: "name", label: "Scheme, grant or programme", req: true },
        { k: "status", label: "Status", type: "select", options: SCHEME_STATUS, value: "Checking" }
      ], v => { p.schemes.push({ name: v.name, status: v.status }); toast("Added"); });
    },
    "add-task"() {
      const p = P(view.id);
      openForm("Add task", [
        { k: "text", label: "Task", req: true },
        { row: [{ k: "owner", label: "Owner", type: "select", options: OWNERS, value: "Navigator" }, { k: "due", label: "Due", type: "date", value: TODAY }] }
      ], v => { p.tasks.push({ id: uid(), text: v.text, owner: v.owner, due: v.due, done: false }); toast("Task added"); });
    },
    copy() {
      const text = summaryText(P(view.id));
      try { navigator.clipboard.writeText(text).then(() => toast("Summary copied"), () => toast("Couldn't copy here")); } catch (e) { toast("Couldn't copy here"); }
    },
    export() {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "care-navigator-demo.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    reset() {
      if (!confirm("Reset to the demo patients? Anything you added in this browser will be removed.")) return;
      db = seed(); view = { kind: "today" }; tlFilter = "All"; render(); toast("Demo data restored");
    }
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
    const fn = actions[el.dataset.act]; if (fn) fn(el);
  });
  document.addEventListener("change", e => {
    const el = e.target, p = view.kind === "patient" ? P(view.id) : null;
    if (!p) return;
    if (el.dataset.act === "task") { const t = p.tasks.find(x => x.id === el.dataset.tid); t.done = el.checked; render(); toast(t.done ? "Task done" : "Task reopened"); }
    if (el.dataset.act === "scheme") { p.schemes[+el.dataset.i].status = el.value; render(); toast("Status updated"); }
  });

  document.addEventListener("submit", e => {
    if (e.target.dataset.form !== "send") return;
    e.preventDefault();
    const text = new FormData(e.target).get("text").trim();
    if (!text) return;
    P(view.id).messages.push({ id: uid(), from: "nav", text, at: stamp() });
    render(); toast("Sent to the family app");
  });

  // Keep the thread scrolled to the newest message, and pick up changes made in the family app.
  const _render = render;
  render = function () { _render(); const t = document.getElementById("thread"); if (t) t.scrollTop = t.scrollHeight; };
  onSync(() => { if (!document.getElementById("dlg").open) render(); });

  render();
</script>
</body>
</html>
