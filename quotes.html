<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes I Live By</title>
<meta name="description" content="Hand-picked quotes on wealth, wisdom, leadership and life.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="style.css?v=4">
<style>
  .hero-inner.compact { padding: 40px 16px 56px; }
  .spotlight {
    background: var(--brand-tint); border-radius: var(--radius); padding: 36px;
    margin-top: -32px; position: relative;
  }
  .label { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .06em; }
  .spotlight blockquote {
    font-size: clamp(22px, 3.6vw, 32px); font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.3; margin: 14px 0 12px;
  }
  .who { color: var(--muted); font-size: 15px; font-weight: 600; }
  .spotlight .btn { margin-top: 20px; }
  .controls { display: flex; flex-direction: column; gap: 14px; margin: 40px 0 20px; }
  input[type=search] {
    font: inherit; font-size: 16px; width: 100%; padding: 16px 22px; border-radius: 999px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  input[type=search]:focus { border-color: var(--brand); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
    cursor: pointer; border: 0; background: var(--surface); color: var(--ink);
  }
  .chip.on { background: var(--brand); color: var(--on-brand); }
  .count { color: var(--muted); font-size: 14px; }
  .list { display: grid; gap: 14px; }
  .quote { background: var(--surface); border-radius: var(--radius); padding: 26px 28px; }
  .quote p { font-size: 19px; font-weight: 600; line-height: 1.45; margin: 0 0 14px; letter-spacing: -0.01em; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .copy {
    font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    background: var(--bg); color: var(--brand); border: 0; border-radius: 999px; padding: 6px 14px;
  }
  .quote .tags { margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div class="hero">
  <nav class="nav">
    <a class="logo" href="index.html"><span class="mark">B</span>The Build Log</a>
    <div class="nav-links">
      <a href="index.html#builds">Builds</a>
      <a class="on" href="quotes.html">Quotes</a>
    </div>
  </nav>
  <div class="hero-inner compact">
    <h1>Quotes I live by.</h1>
    <p>Ideas on wealth, wisdom and leadership that I keep coming back to. Every quote here is hand-picked.</p>
  </div>
</div>

<main class="section" style="padding-top:0">
  <section class="spotlight" id="spotlight"></section>

  <div class="controls">
    <input type="search" id="search" placeholder="Search quotes, authors or themes">
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="list" id="list"></div>
</main>

<footer>
  <div class="footer-inner">
    <span>The Build Log &middot; by Yash Piplani, built with Claude</span>
    <a href="index.html">&larr; Back to all builds</a>
  </div>
</footer>

<script>
  // ADD YOUR QUOTES HERE.
  // Copy one block, paste it below the last one, and change the text, author, source and tags.
  // Keep the quote text inside the double quotes. Each block ends with a comma.
  const quotes = [
    {
      text: "Happiness is a state where nothing is missing.",
      author: "Naval Ravikant",
      source: "",
      tags: ["Happiness", "Peace"]
    },
    {
      text: "Don't take yourself so seriously. You're just a monkey with a plan.",
      author: "Naval Ravikant",
      source: "",
      tags: ["Happiness", "Peace"]
    },
    {
      text: "Play long-term games with long-term people. All returns in life, whether in wealth, relationships, or knowledge, come from compound interest.",
      author: "Naval Ravikant",
      source: "",
      tags: ["Wealth", "Business"]
    },
    {
      text: "You want to be rich and anonymous, not poor and famous.",
      author: "Naval Ravikant",
      source: "",
      tags: ["Wealth", "Business"]
    },
    {
      text: "You make your own luck if you stay at it long enough.",
      author: "Naval Ravikant",
      source: "",
      tags: ["Wealth", "Business"]
    },
    {
      text: "A leader is best when people barely know he exists, when his work is done, his aim fulfilled, they will say: we did it ourselves.",
      author: "Lao Tzu",
      source: "Tao Te Ching",
      tags: ["Leadership"]
    },
    {
      text: "Lead me, follow me, or get out of my way.",
      author: "General George Patton",
      source: "",
      tags: ["Leadership"]
    },
  ];

  let activeAuthor = "All";
  const $ = id => document.getElementById(id);
  const credit = q => q.author + (q.source ? ", " + q.source : "");

  function spotlight() {
    if (!quotes.length) { $("spotlight").style.display = "none"; return; }
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    $("spotlight").innerHTML = `
      <div class="label">Today's pick</div>
      <blockquote>&ldquo;${q.text}&rdquo;</blockquote>
      <div class="who">${credit(q)}</div>
      <button class="btn btn-brand" onclick="spotlight()">Show another</button>`;
  }

  function chips() {
    const authors = ["All", ...new Set(quotes.map(q => q.author))];
    $("chips").innerHTML = authors.map(a =>
      `<button class="chip ${a === activeAuthor ? "on" : ""}" data-a="${a}">${a}</button>`).join("");
    $("chips").querySelectorAll(".chip").forEach(c =>
      c.onclick = () => { activeAuthor = c.dataset.a; chips(); render(); });
  }

  function render() {
    const term = $("search").value.toLowerCase();
    const shown = quotes.filter(q =>
      (activeAuthor === "All" || q.author === activeAuthor) &&
      (q.text + q.author + (q.source || "") + q.tags.join(" ")).toLowerCase().includes(term));
    $("count").textContent = `${shown.length} of ${quotes.length} quotes`;
    $("list").innerHTML = shown.length ? shown.map(q => `
      <article class="quote">
        <p>&ldquo;${q.text}&rdquo;</p>
        <div class="meta">
          <span class="who">${credit(q)}</span>
          <button class="copy" data-i="${quotes.indexOf(q)}">Copy</button>
        </div>
        <div class="tags">${q.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      </article>`).join("") : `<div class="empty">No quotes match that search.</div>`;
    $("list").querySelectorAll(".copy").forEach(b => b.onclick = () => {
      const q = quotes[b.dataset.i];
      navigator.clipboard.writeText(`"${q.text}" (${q.author})`).then(() => {
        b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200);
      }).catch(() => {});
    });
  }

  $("search").oninput = render;
  spotlight(); chips(); render();
</script>
</body>
</html>
